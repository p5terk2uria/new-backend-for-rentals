server:
  port: 8333

spring:
  application:
    name: product-service

  datasource:
    url: jdbc:mysql://localhost:3306/HouseListings?useSSL=false&serverTimezone=UTC
    username: root
    password: peter
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 180000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

videos:
  folder: videos
  base-url: http://localhost:8333/videos/