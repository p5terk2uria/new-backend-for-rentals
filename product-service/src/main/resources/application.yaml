server:
  port: 8333

spring:
  application:
    name: product-service

  datasource:
    url: jdbc:postgresql://localhost:5432/vcbinternetbankingdb
    username: admin
    password: admin@123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

videos:
  folder: videos
  base-url: http://localhost:8333/videos/

