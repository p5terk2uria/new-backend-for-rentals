server:
  port: 83 # or whatever port you want

spring:
  application:
    name: authentication-service

  datasource:
    url: jdbc:mysql://localhost:3306/authdb?useSSL=false&serverTimezone=UTC
    username: root
    password: peter
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 180000

  jpa:
    hibernate:
      ddl-auto: update       # create / update tables automatically
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect   # ✅ use MySQL dialect
        format_sql: true
    open-in-view: false

  jwt:
    secret-key: "Gv7kR2t0eJ0mQyqB1T8Vw3C4Z9lFh2rPp8bK0sXq7Jt4Wm9eD3Fq6Yv1Nn5Rc8Zd"
    expiration: 3600000   # 1 hour in ms
