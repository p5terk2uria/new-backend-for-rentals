server:
  port: 8332

spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://localhost:5432/vcbinternetbankingdb
    username: admin
    password: admin@123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 180000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation:true
    open-in-view: false